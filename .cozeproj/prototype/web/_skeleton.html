<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- 字体 -->
  <link href="https://lf-code-agent.coze.cn/obj/x-ai-cn/fonts/google/google-all-fonts.css" rel="stylesheet"/>

  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/jquery/jquery-3.7.1.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/lucide/lucide-1.11.0.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/tailwindcss/tailwindcss-browser-4.2.4.min.js"></script>

  <style type="text/tailwindcss">
    @theme {
      /* === 品牌色 === */
      --color-primary:              #7C5CFF;
      --color-primary-container:    rgba(124, 92, 255, 0.15);
      --color-on-primary:           #ffffff;
      /* === 强调色 === */
      --color-accent:               #69E7FF;
      --color-accent-container:     rgba(105, 231, 255, 0.12);
      /* === 背景 / 表面 === */
      --color-background:                 #070A14;
      --color-surface-container-lowest:   #0B1020;
      --color-surface:                    #0F1629;
      --color-surface-container:          #151D35;
      --color-surface-container-high:     #1B2540;
      --color-surface-container-highest:  #222E4F;
      /* === 文字 === */
      --color-on-surface:           #F7FAFF;
      --color-on-surface-variant:   #9AA7C7;
      /* === 功能色 === */
      --color-success:  #62FAD3;
      --color-error:    #FF6B6B;
      --color-warning:  #FFB84D;
      /* === 边框 === */
      --color-outline:          rgba(255, 255, 255, 0.12);
      --color-outline-variant:  rgba(255, 255, 255, 0.06);
      /* === 圆角 === */
      --radius-sm:   0.375rem;
      --radius-md:   0.625rem;
      --radius-lg:   0.875rem;
      --radius-xl:   1.125rem;
      --radius-2xl:  1.5rem;
      --radius-full: 9999px;
      /* === 阴影 === */
      --shadow-card:   0 2px 12px rgba(0, 0, 0, 0.4);
      --shadow-float:  0 8px 30px rgba(0, 0, 0, 0.5);
      --shadow-dialog: 0 25px 50px rgba(0, 0, 0, 0.6);
      /* === 字体 === */
      --font-sans: "Inter", "Noto Sans SC", system-ui, sans-serif;
    }
  </style>

  <style>
    /* 毛玻璃效果 */
    .glass { background: rgba(255,255,255,0.04); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    .glass-card { background: rgba(255,255,255,0.05); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    .glass-sidebar { background: rgba(15,22,41,0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
    .glass-header { background: rgba(7,10,20,0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
    /* 发光效果 */
    .glow-primary { box-shadow: 0 0 20px rgba(124,92,255,0.15); }
    .glow-accent { box-shadow: 0 0 20px rgba(105,231,255,0.12); }
    /* 渐变背景 */
    .bg-gradient-mesh {
      background:
        radial-gradient(ellipse 600px 400px at 10% 20%, rgba(124,92,255,0.08) 0%, transparent 70%),
        radial-gradient(ellipse 500px 350px at 90% 80%, rgba(105,231,255,0.05) 0%, transparent 70%),
        #070A14;
    }
  </style>

  <!-- 图片兜底 -->
  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%230F1629"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%239AA7C7" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>
</head>

<body class="bg-background text-on-surface font-sans bg-gradient-mesh min-h-screen">

  <!-- @nav:start 导航组件，不需要的页面则不要复制此段 -->
  <!-- 顶部导航栏 -->
  <header class="glass-header sticky top-0 z-50 h-14 flex items-center justify-between px-5 border-b border-outline-variant/20">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-primary/20 flex items-center justify-center">
        <i data-lucide="chart-column-big" class="w-4.5 h-4.5 text-primary"></i>
      </div>
      <span class="font-bold text-base text-on-surface tracking-tight">久久金运营看板</span>
    </div>
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-surface-container border border-outline-variant/20">
        <i data-lucide="calendar" class="w-3.5 h-3.5 text-on-surface-variant"></i>
        <span class="text-xs text-on-surface-variant">2026年6月</span>
      </div>
      <button class="relative p-2 rounded-lg hover:bg-surface-container transition-colors">
        <i data-lucide="bell" class="w-4 h-4 text-on-surface-variant"></i>
        <span class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-error"></span>
      </button>
      <div class="flex items-center gap-2 pl-3 border-l border-outline-variant/20">
        <div class="w-7 h-7 rounded-full bg-primary/20 flex items-center justify-center text-xs font-medium text-primary">初</div>
      </div>
    </div>
  </header>

  <div class="flex" style="height: calc(100vh - 3.5rem)">
    <!-- 侧边栏 -->
    <aside class="glass-sidebar w-56 shrink-0 border-r border-outline-variant/20 overflow-y-auto">
      <nav class="p-3 space-y-0.5">
        <a href="home.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-primary-container text-primary font-medium text-sm">
          <i data-lucide="layout-dashboard" class="w-4 h-4"></i>总览仪表盘
        </a>
        <a href="meituan.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-on-surface-variant hover:bg-surface-container hover:text-on-surface font-medium text-sm transition-colors">
          <i data-lucide="store" class="w-4 h-4"></i>美团运营
        </a>
        <a href="content.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-on-surface-variant hover:bg-surface-container hover:text-on-surface font-medium text-sm transition-colors">
          <i data-lucide="pen-tool" class="w-4 h-4"></i>内容矩阵
        </a>
        <a href="private-domain.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-on-surface-variant hover:bg-surface-container hover:text-on-surface font-medium text-sm transition-colors">
          <i data-lucide="users" class="w-4 h-4"></i>私域运营
        </a>
        <a href="collaboration.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-on-surface-variant hover:bg-surface-container hover:text-on-surface font-medium text-sm transition-colors">
          <i data-lucide="network" class="w-4 h-4"></i>跨部门协同
        </a>
        <a href="actions.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-on-surface-variant hover:bg-surface-container hover:text-on-surface font-medium text-sm transition-colors">
          <i data-lucide="target" class="w-4 h-4"></i>行动计划
        </a>
      </nav>
      <!-- 侧边栏底部：模块健康度概览 -->
      <div class="p-3 mt-auto border-t border-outline-variant/20">
        <div class="px-3 py-2">
          <p class="text-xs text-on-surface-variant mb-2">数据截止</p>
          <p class="text-xs text-on-surface font-medium">2026年6月30日</p>
        </div>
      </div>
    </aside>

    <!-- @main-content:start -->
    <main class="flex-1 min-w-0 overflow-y-auto p-5">
      <!-- 页面内容 -->
    </main>
    <!-- @main-content:end -->
  </div>
  <!-- @nav:end 导航组件 -->

  <script>lucide.createIcons();</script>
</body>

</html>
